<!doctype html><html lang="es"><meta charset="utf-8"><title>Verificación de espacios en fichas</title>
<link rel="stylesheet" href="bootstrap.min.css">
<style>body{padding:20px}.report-student-heading{display:flex;align-items:center;gap:12px}.report-card{width:1000px}.card-header h5{margin-bottom:4px}canvas{max-width:100%;border:1px solid #aaa}h2{font-size:18px;margin:16px 0}</style>
<h2>Ficha original</h2><div id="ficha" class="card report-card"><div class="card-header"><div class="report-student-heading"><div><h5>SEGUIMIENTO DE: <a>MARTÍNEZ RIVERA MARÍA ÁNGEL ↗</a></h5><span class="badge badge-secondary">Grado 7 | IER LA JOSEFINA - Vallesol</span></div></div></div><div class="card-body">Mensaje de prueba con espacios entre palabras.</div></div>
<h2>Generador anterior</h2><div id="antes"></div><h2>Generador actualizado</h2><div id="despues"></div><p id="estado">Preparando…</p>
<script src="antiguo.js"></script><script>window.generadorAnterior=window.html2canvas;</script><script src="nuevo.js"></script>
<script>(async()=>{try{await document.fonts.ready;const ficha=document.getElementById('ficha');document.getElementById('antes').appendChild(await generadorAnterior(ficha,{logging:false,scale:2,useCORS:true,backgroundColor:'#fff'}));document.getElementById('despues').appendChild(await html2canvas(ficha,{logging:false,scale:2,useCORS:true,backgroundColor:'#fff'}));document.getElementById('estado').textContent='Exportaciones completadas';}catch(e){document.getElementById('estado').textContent=e.stack;}})();</script></html>
