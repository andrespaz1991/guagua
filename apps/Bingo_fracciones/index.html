<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo de Fracciones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Bingo de Fracciones</h1>
        <button onclick="generateBingoCards()">Generar Tarjetas de Bingo</button>
        <div id="bingoCardsContainer">
            <!-- Las tarjetas de bingo serán generadas aquí -->
        </div>
        <div id="masterBoardContainer">
            <h2>Tablero Maestro</h2>
            <table id="masterBoard">
                <!-- El tablero maestro será generado aquí -->
            </table>
        </div>
        <div id="allFractionsContainer">
            <h2>Fichas de la Bolsa</h2>
            <div id="fractionsList">
                <!-- Las fracciones serán generadas aquí -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
