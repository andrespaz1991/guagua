<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Educativa - Sede Vallesol</title>
    
    <!-- Tailwind CSS (CDN Correcto) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #c7d2fe 100%);
            min-height: 100vh;
            color: #1e293b;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .roulette-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            aspect-ratio: 1;
        }

        .roulette-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15), inset 0 0 15px rgba(0,0,0,0.1);
            /* La transición de 5s controla la suavidad del giro */
            transition: transform 5s cubic-bezier(0.15, 0.85, 0.15, 1);
            background-color: #fff;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 48px;
            background: #ef4444;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }

        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.9) translateY(20px); }
        .modal-enter-active { opacity: 1; transform: scale(1) translateY(0); transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.95); transition: all 0.3s ease; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- HEADER -->
    <header class="max-w-6xl mx-auto flex flex-col items-center justify-center mb-8 text-center">
        <div class="bg-blue-600 text-white p-3 rounded-2xl mb-3 shadow-lg">
            <i data-lucide="gamepad-2" class="w-8 h-8"></i>
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold text-blue-900 tracking-tight">Dinámica Participativa</h1>
        <p class="text-slate-500 font-medium mt-1">IER Josefina - Sede Vallesol</p>
    </header>

    <!-- PASO 1: CONFIGURACIÓN -->
    <main id="setupSection" class="max-w-5xl mx-auto glass-panel rounded-3xl p-6 md:p-10 transition-all duration-500">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-6 gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-100 text-indigo-600 p-2 rounded-lg"><i data-lucide="settings"></i></div>
                <h2 class="text-2xl font-bold text-slate-800">1. Configurar Listas</h2>
            </div>
            
            <!-- Selector de Modos -->
            <div class="flex bg-slate-100 p-1 rounded-xl shadow-inner">
                <button id="modeDoubleBtn" class="px-6 py-2 rounded-lg font-bold text-sm transition-all duration-300 bg-white text-blue-600 shadow-sm">
                    Estudiantes + Retos
                </button>
                <button id="modeSingleBtn" class="px-6 py-2 rounded-lg font-bold text-sm text-slate-500 transition-all duration-300 hover:text-slate-700">
                    Solo Estudiantes
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="setupGrid">
            <!-- Participantes -->
            <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 w-full transition-all duration-300" id="participantsSetup">
                <label class="flex items-center gap-2 font-bold text-slate-700 mb-3 text-lg">
                    <i data-lucide="users" class="w-5 h-5 text-blue-500"></i> Participantes
                </label>
                <textarea id="participantsInput" rows="5" class="w-full p-4 border border-slate-300 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition-all resize-none shadow-inner" placeholder="Pega los nombres separados por coma o saltos de línea..."></textarea>
                
                <div class="mt-4 flex flex-col gap-2">
                    <label class="cursor-pointer bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors font-medium">
                        <i data-lucide="upload-cloud" class="w-4 h-4"></i> Cargar CSV
                        <input type="file" id="csvParticipants" accept=".csv" class="hidden">
                    </label>
                    <span id="fileNameParticipants" class="text-xs text-slate-500 text-center">Ningún archivo seleccionado</span>
                </div>
            </div>

            <!-- Preguntas -->
            <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 w-full transition-all duration-300" id="questionsSetup">
                <label class="flex items-center gap-2 font-bold text-slate-700 mb-3 text-lg">
                    <i data-lucide="message-circle-question" class="w-5 h-5 text-emerald-500"></i> Preguntas / Retos
                </label>
                <textarea id="questionsInput" rows="5" class="w-full p-4 border border-slate-300 rounded-xl focus:ring-4 focus:ring-emerald-100 focus:border-emerald-500 transition-all resize-none shadow-inner" placeholder="Pega las preguntas separadas por coma o saltos de línea..."></textarea>
                
                <div class="mt-4 flex flex-col gap-2">
                    <label class="cursor-pointer bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors font-medium">
                        <i data-lucide="upload-cloud" class="w-4 h-4"></i> Cargar CSV
                        <input type="file" id="csvQuestions" accept=".csv" class="hidden">
                    </label>
                    <span id="fileNameQuestions" class="text-xs text-slate-500 text-center">Ningún archivo seleccionado</span>
                </div>
            </div>
        </div>

        <div class="mt-8 flex justify-center">
            <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-10 rounded-full shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex items-center gap-2 text-lg">
                <i data-lucide="play" class="w-5 h-5"></i> Iniciar Dinámica
            </button>
        </div>
    </main>

    <!-- PASO 2: EL JUEGO -->
    <main id="gameSection" class="hidden max-w-6xl mx-auto glass-panel rounded-3xl p-6 md:p-10 transition-all duration-500">
        
        <!-- Tablero de Estado -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200">
            <div class="flex gap-6">
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Turno Actual</span>
                    <span id="currentParticipantLabel" class="font-bold text-blue-600 text-xl">-- Seleccionando --</span>
                </div>
                <div class="w-px bg-slate-300"></div>
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Participantes Restantes</span>
                    <span id="participantsCountLabel" class="font-bold text-slate-700 text-xl">0</span>
                </div>
            </div>
            <button id="resetConfigBtn" class="text-sm font-semibold text-slate-500 hover:text-red-500 transition-colors flex items-center gap-1">
                <i data-lucide="arrow-left-left" class="w-4 h-4"></i> Volver a Configurar
            </button>
        </div>

        <!-- Ruletas -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 justify-items-center" id="roulettesWrapper">
            
            <!-- Ruleta de Participantes -->
            <div class="flex flex-col items-center w-full max-w-md">
                <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <span class="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center">1</span>
                    Elegir Estudiante
                </h3>
                <div class="roulette-container">
                    <div class="pointer"></div>
                    <canvas id="participantsCanvas" width="400" height="400" class="roulette-canvas"></canvas>
                </div>
                <button id="spinParticipantsBtn" class="mt-8 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:hover:translate-y-0 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300 w-full max-w-xs flex items-center justify-center gap-2">
                    <i data-lucide="dices" class="w-5 h-5"></i> Girar Ruleta
                </button>
            </div>

            <!-- Ruleta de Preguntas (Se oculta en modo simple) -->
            <div class="flex flex-col items-center opacity-50 transition-opacity duration-300 pointer-events-none w-full max-w-md" id="questionsContainer">
                <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <span class="bg-emerald-100 text-emerald-600 w-8 h-8 rounded-full flex items-center justify-center">2</span>
                    Asignar Reto
                </h3>
                <div class="roulette-container">
                    <div class="pointer" style="background: #10b981;"></div>
                    <canvas id="questionsCanvas" width="400" height="400" class="roulette-canvas"></canvas>
                </div>
                <button id="spinQuestionsBtn" class="mt-8 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 disabled:hover:translate-y-0 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300 w-full max-w-xs flex items-center justify-center gap-2">
                    <i data-lucide="help-circle" class="w-5 h-5"></i> Girar Preguntas
                </button>
            </div>
            
        </div>
    </main>

    <!-- MODAL DE GANADOR (Participante) -->
    <div id="winnerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 transition-all duration-300 opacity-0">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl modal-enter text-center transform transition-transform duration-300" id="winnerModalContent">
            <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-yellow-50">
                <i data-lucide="award" class="w-10 h-10 text-yellow-500"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">¡Es el turno de!</h3>
            <p id="winnerText" class="text-3xl font-extrabold text-blue-900 mb-6 leading-tight"></p>
            <button id="continueToQuestionBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-colors">
                Asignar Reto
            </button>
        </div>
    </div>

    <!-- MODAL DE PREGUNTA (Solo en Modo Doble) -->
    <div id="questionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 transition-all duration-300 opacity-0">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 shadow-2xl modal-enter text-center transform transition-transform duration-300" id="questionModalContent">
            <span id="questionNumberBadge" class="inline-block bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-full text-xs mb-4"></span>
            <h3 class="text-2xl font-bold text-slate-800 mb-6 leading-relaxed" id="questionText"></h3>
            
            <div class="flex gap-3 mt-4">
                <button id="nextParticipantBtn" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl transition-colors">
                    Siguiente Turno
                </button>
            </div>
        </div>
    </div>

    <script>
        // Inicializar Iconos
        lucide.createIcons();

        // Variables de Estado
        let currentMode = 'double'; // 'double' o 'single'
        let availableParticipants = [];
        let availableQuestions = []; 
        let currentParticipant = null;
        let currentQuestion = null;
        
        let rotationParticipants = 0;
        let rotationQuestions = 0;

        // Paleta de Colores Gamificada
        const colors = [
            '#ef4444', '#f97316', '#f59e0b', '#84cc16', 
            '#10b981', '#06b6d4', '#3b82f6', '#6366f1', 
            '#8b5cf6', '#d946ef', '#f43f5e'
        ];

        // Referencias DOM Modos
        const modeDoubleBtn = document.getElementById('modeDoubleBtn');
        const modeSingleBtn = document.getElementById('modeSingleBtn');
        const setupGrid = document.getElementById('setupGrid');
        const questionsSetup = document.getElementById('questionsSetup');
        const roulettesWrapper = document.getElementById('roulettesWrapper');

        // Referencias DOM Inputs & Botones
        const setupSection = document.getElementById('setupSection');
        const gameSection = document.getElementById('gameSection');
        
        const participantsInput = document.getElementById('participantsInput');
        const questionsInput = document.getElementById('questionsInput');
        const csvParticipants = document.getElementById('csvParticipants');
        const csvQuestions = document.getElementById('csvQuestions');
        const fileNames = { p: document.getElementById('fileNameParticipants'), q: document.getElementById('fileNameQuestions') };
        
        const startBtn = document.getElementById('startBtn');
        const resetConfigBtn = document.getElementById('resetConfigBtn');
        
        const spinParticipantsBtn = document.getElementById('spinParticipantsBtn');
        const spinQuestionsBtn = document.getElementById('spinQuestionsBtn');
        const questionsContainer = document.getElementById('questionsContainer');
        
        const currentParticipantLabel = document.getElementById('currentParticipantLabel');
        const participantsCountLabel = document.getElementById('participantsCountLabel');

        const winnerModal = document.getElementById('winnerModal');
        const winnerModalContent = document.getElementById('winnerModalContent');
        const winnerText = document.getElementById('winnerText');
        const continueToQuestionBtn = document.getElementById('continueToQuestionBtn');

        const questionModal = document.getElementById('questionModal');
        const questionModalContent = document.getElementById('questionModalContent');
        const questionText = document.getElementById('questionText');
        const questionNumberBadge = document.getElementById('questionNumberBadge');
        const nextParticipantBtn = document.getElementById('nextParticipantBtn');

        // --- LÓGICA DE PESTAÑAS (MODOS) ---
        modeDoubleBtn.addEventListener('click', () => {
            currentMode = 'double';
            // Estilos de botones
            modeDoubleBtn.className = "px-6 py-2 rounded-lg font-bold text-sm transition-all duration-300 bg-white text-blue-600 shadow-sm";
            modeSingleBtn.className = "px-6 py-2 rounded-lg font-bold text-sm text-slate-500 transition-all duration-300 hover:text-slate-700";
            
            // Mostrar config de preguntas
            setupGrid.classList.add('md:grid-cols-2');
            setupGrid.classList.remove('md:grid-cols-1');
            questionsSetup.classList.remove('hidden');
        });

        modeSingleBtn.addEventListener('click', () => {
            currentMode = 'single';
            // Estilos de botones
            modeSingleBtn.className = "px-6 py-2 rounded-lg font-bold text-sm transition-all duration-300 bg-white text-blue-600 shadow-sm";
            modeDoubleBtn.className = "px-6 py-2 rounded-lg font-bold text-sm text-slate-500 transition-all duration-300 hover:text-slate-700";
            
            // Ocultar config de preguntas
            setupGrid.classList.remove('md:grid-cols-2');
            setupGrid.classList.add('md:grid-cols-1');
            questionsSetup.classList.add('hidden');
        });


        // --- MANEJO DE ARCHIVOS ---
        const handleFileUpload = (e, textarea, label) => {
            const file = e.target.files[0];
            if (!file) return;
            label.textContent = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const items = text.split(/[\n,]/).map(item => item.trim()).filter(Boolean);
                textarea.value = items.join('\n');
            };
            reader.readAsText(file);
        };
        csvParticipants.addEventListener('change', (e) => handleFileUpload(e, participantsInput, fileNames.p));
        csvQuestions.addEventListener('change', (e) => handleFileUpload(e, questionsInput, fileNames.q));


        // --- FLUJO DEL JUEGO ---
        startBtn.addEventListener('click', () => {
            const pRaw = participantsInput.value.split('\n').map(i => i.trim()).filter(Boolean);
            const qRaw = questionsInput.value.split('\n').map(i => i.trim()).filter(Boolean);

            if (pRaw.length < 2) {
                alert('Por favor ingresa al menos 2 participantes.');
                return;
            }
            if (currentMode === 'double' && qRaw.length < 2) {
                alert('Por favor ingresa al menos 2 preguntas/retos.');
                return;
            }

            availableParticipants = [...pRaw];
            
            // Adaptar interfaz de juego según el modo
            if (currentMode === 'single') {
                roulettesWrapper.classList.remove('md:grid-cols-2');
                roulettesWrapper.classList.add('md:grid-cols-1');
                questionsContainer.classList.add('hidden');
                continueToQuestionBtn.textContent = "Siguiente Turno";
            } else {
                availableQuestions = qRaw.map((q, i) => ({ text: q, originalNumber: i + 1 }));
                roulettesWrapper.classList.add('md:grid-cols-2');
                roulettesWrapper.classList.remove('md:grid-cols-1');
                questionsContainer.classList.remove('hidden');
                continueToQuestionBtn.textContent = "Asignar Reto";
                drawRoulette('questionsCanvas', availableQuestions.map(q => `Pregunta ${q.originalNumber}`));
            }

            updateDashboard();
            drawRoulette('participantsCanvas', availableParticipants);

            // Transiciones visuales
            setupSection.classList.add('hidden');
            gameSection.classList.remove('hidden');
            gameSection.classList.add('animate-fade-in');
        });

        resetConfigBtn.addEventListener('click', () => {
            gameSection.classList.add('hidden');
            setupSection.classList.remove('hidden');
            rotationParticipants = 0;
            rotationQuestions = 0;
            document.getElementById('participantsCanvas').style.transform = `rotate(0deg)`;
            document.getElementById('questionsCanvas').style.transform = `rotate(0deg)`;
            questionsContainer.classList.add('opacity-50', 'pointer-events-none');
            spinParticipantsBtn.disabled = false;
        });

        function updateDashboard() {
            participantsCountLabel.textContent = availableParticipants.length;
            currentParticipantLabel.textContent = '-- Seleccionando --';
            currentParticipantLabel.classList.remove('text-slate-400');
            currentParticipantLabel.classList.add('text-blue-600');
        }

        // --- LÓGICA DE DIBUJO DEL CANVAS ---
        function drawRoulette(canvasId, items) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const radius = width / 2;
            const sliceAngle = (2 * Math.PI) / items.length;

            ctx.clearRect(0, 0, width, height);

            if(items.length === 0) {
                ctx.fillStyle = '#f1f5f9';
                ctx.beginPath(); ctx.arc(radius, radius, radius, 0, 2*Math.PI); ctx.fill();
                return;
            }

            for (let i = 0; i < items.length; i++) {
                const startAngle = i * sliceAngle - Math.PI / 2; 
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                
                const fontSize = Math.max(12, Math.min(24, 250 / items.length));
                ctx.font = `600 ${fontSize}px Poppins`;
                
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                let text = items[i];
                if (text.length > 20) text = text.substring(0, 18) + '...';
                
                ctx.fillText(text, radius - 30, 0);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(radius, radius, 25, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
        }

        // --- FÍSICA DE GIRO ---
        function spin(canvasId, items, isParticipant, callback) {
            const canvas = document.getElementById(canvasId);
            
            const spins = Math.floor(Math.random() * 5) + 6;
            const extraDegrees = Math.floor(Math.random() * 360);
            const totalDegrees = (spins * 360) + extraDegrees;

            if(isParticipant) {
                rotationParticipants += totalDegrees;
                canvas.style.transform = `rotate(${rotationParticipants}deg)`;
            } else {
                rotationQuestions += totalDegrees;
                canvas.style.transform = `rotate(${rotationQuestions}deg)`;
            }

            const sliceAngle = 360 / items.length;
            const rotation = isParticipant ? rotationParticipants : rotationQuestions;
            const normalizedRotation = rotation % 360;
            const winningIndex = Math.floor((360 - normalizedRotation) / sliceAngle) % items.length;

            setTimeout(() => {
                callback(winningIndex);
            }, 5000); 
        }

        // --- EVENTOS DE JUEGO ---
        
        // 1. Tirar Participante
        spinParticipantsBtn.addEventListener('click', () => {
            if (availableParticipants.length === 0) return;
            spinParticipantsBtn.disabled = true;
            
            spin('participantsCanvas', availableParticipants, true, (winnerIndex) => {
                currentParticipant = availableParticipants[winnerIndex];
                
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#3b82f6', '#10b981', '#fbbf24'] });
                
                winnerText.textContent = currentParticipant;
                showModal(winnerModal, winnerModalContent);
                
                availableParticipants.splice(winnerIndex, 1);
            });
        });

        // 2. Continuar desde el Modal de Ganador
        continueToQuestionBtn.addEventListener('click', () => {
            hideModal(winnerModal, winnerModalContent);
            currentParticipantLabel.textContent = currentParticipant;
            
            if (currentMode === 'single') {
                // En modo simple, saltar la pregunta e ir directamente a prepararse para el siguiente turno
                procederSiguienteTurno();
            } else {
                // En modo doble, habilitar ruleta de preguntas
                questionsContainer.classList.remove('opacity-50', 'pointer-events-none');
                spinQuestionsBtn.disabled = false;
            }
        });

        // 3. Tirar Pregunta (Solo en Modo Doble)
        spinQuestionsBtn.addEventListener('click', () => {
            if (availableQuestions.length === 0) {
                alert("No hay más preguntas disponibles.");
                return;
            }
            spinQuestionsBtn.disabled = true;
            
            spin('questionsCanvas', availableQuestions, false, (winnerIndex) => {
                currentQuestion = availableQuestions[winnerIndex];
                
                questionNumberBadge.textContent = `Reto #${currentQuestion.originalNumber}`;
                questionText.textContent = currentQuestion.text;
                showModal(questionModal, questionModalContent);
                
                availableQuestions.splice(winnerIndex, 1);
            });
        });

        // 4. Siguiente Turno desde Modal de Pregunta
        nextParticipantBtn.addEventListener('click', () => {
            hideModal(questionModal, questionModalContent);
            questionsContainer.classList.add('opacity-50', 'pointer-events-none');
            procederSiguienteTurno();
        });

        // Función para preparar el siguiente turno (Compartida por ambos modos)
        function procederSiguienteTurno() {
            if (availableParticipants.length > 0) {
                spinParticipantsBtn.disabled = false;
                updateDashboard();
                drawRoulette('participantsCanvas', availableParticipants);
                
                if (currentMode === 'double') {
                    drawRoulette('questionsCanvas', availableQuestions.map(q => `Pregunta ${q.originalNumber}`));
                }
            } else {
                currentParticipantLabel.textContent = "¡Dinámica Finalizada!";
                currentParticipantLabel.classList.add('text-slate-400');
                currentParticipantLabel.classList.remove('text-blue-600');
                participantsCountLabel.textContent = "0";
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 }});
            }
        }

        // --- UTILIDADES DE MODALES ---
        function showModal(modal, content) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.add('modal-enter-active');
            content.classList.remove('modal-enter');
        }

        function hideModal(modal, content) {
            modal.classList.add('opacity-0');
            content.classList.remove('modal-enter-active');
            content.classList.add('modal-enter');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

    </script>
</body>
</html>
