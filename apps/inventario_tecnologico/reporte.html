<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte completo del inventario</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2ec;color:#203c30;font:13px/1.5 "Segoe UI",Arial,sans-serif}.actions{position:sticky;top:0;background:#203c30;color:white;padding:16px 24px;display:flex;gap:18px;align-items:center;z-index:2}.actions p{margin:0;flex:1}.actions button{border:0;background:#e1f0d9;color:#203c30;padding:12px 18px;border-radius:8px;font-weight:700;cursor:pointer}.actions button:disabled{opacity:.5}.report{max-width:1000px;margin:24px auto;background:white;padding:40px}.eyebrow{color:#73816e;text-transform:uppercase;font-size:11px;letter-spacing:2px}h1{font-size:30px;line-height:1.2;margin:10px 0}h2{font-size:21px}h3{font-size:17px;margin:0}.muted{color:#73816e}.summary{display:flex;gap:30px;margin:24px 0;padding:18px;background:#f0f6ed}.summary strong{display:block;font-size:24px}table{width:100%;border-collapse:collapse;margin:12px 0;font-size:11px}th,td{border-bottom:1px solid #dce5d8;text-align:left;padding:7px;overflow-wrap:anywhere}thead{display:table-header-group}th{background:#f0f6ed}.product{border-top:2px solid #d3dfce;padding:20px 0;margin:15px 0;break-inside:avoid}.product-head{display:flex;justify-content:space-between;gap:20px}.badge{background:#edf4e8;padding:5px 10px;border-radius:5px;white-space:nowrap}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin:14px 0}.fields p{margin:0}.fields b{color:#52624e}.description{padding:12px;background:#f7f9f4}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}figure{margin:0;break-inside:avoid}figure img{width:100%;height:170px;object-fit:contain;border:1px solid #e0e6dc;background:#fafbf8}figcaption{font-size:10px;color:#798573}.no-photo{padding:24px;border:1px dashed #ccd9c6;text-align:center;color:#73816e}.group-title{border-bottom:2px solid #203c30;padding-bottom:8px;margin-top:36px}.footer{border-top:1px solid #dce5d8;margin-top:25px;padding-top:12px;font-size:10px;color:#73816e}.error{color:#a43c32}@page{size:A4;margin:15mm}@media print{body{background:white;color:#152a21;font-size:10pt}.actions{display:none}.report{padding:0;margin:0;max-width:none}.summary{padding:10px}h1{font-size:24pt}h2{font-size:16pt}h3{font-size:13pt}.group-title{break-after:avoid}.product{break-inside:auto}.product-head,.fields,.description{break-inside:avoid}.photos{grid-template-columns:repeat(3,1fr)}figure img{height:42mm}tr{break-inside:avoid}thead{display:table-header-group}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}@media(max-width:650px){.report{padding:20px;margin:10px}.actions{flex-wrap:wrap}.fields{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}.summary{gap:14px;flex-wrap:wrap}}

/* Vista de tarjetas compartida por la vista previa y la impresión. */
.report{max-width:1100px;border:1px solid #dce5d8;border-radius:16px;box-shadow:0 12px 40px #203c3010}.actions select{font:inherit;padding:10px;border:1px solid #d3dfce;border-radius:8px;background:white;color:#203c30}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0;background:none}.summary>div{border:1px solid #dce5d8;border-radius:12px;padding:16px;background:#f7faf5}.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.product{min-width:0;border:1px solid #dce5d8;border-radius:12px;padding:0;margin:0;overflow:hidden;background:white;break-inside:avoid}.product-head{padding:14px 14px 0;display:flex;flex-direction:column;gap:7px}.product-head h3{font-size:16px;overflow-wrap:anywhere}.badge{align-self:flex-start;font-size:10px;white-space:normal}.fields{padding:0 14px;grid-template-columns:1fr;gap:4px;font-size:11px;overflow-wrap:anywhere}.description{margin:10px 14px 14px;font-size:11px;border-radius:7px;overflow-wrap:anywhere}.photos{display:block;margin:0}.photos figure:not(:first-child),.photos figcaption{display:none}.photos figure img{height:160px;border:0;border-bottom:1px solid #e0e6dc;background:#edf2ec;object-fit:contain}.no-photo{height:160px;display:flex;align-items:center;justify-content:center;border:0;border-bottom:1px solid #e0e6dc;background:#edf2ec}.product>h4,.product>table{display:none}.group-title{font-size:18px;margin:28px 0 14px}.detailed .category-grid{grid-template-columns:1fr}.detailed .product{padding:18px}.detailed .product-head{padding:0;flex-direction:row;justify-content:space-between}.detailed .fields{padding:0;grid-template-columns:1fr 1fr}.detailed .description{margin:14px 0}.detailed .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.detailed .photos figure:not(:first-child),.detailed .photos figcaption,.detailed .product>h4{display:block}.detailed .product>table{display:table}.detailed .no-photo{height:auto;padding:24px}.detailed .product{break-inside:auto}
@media(max-width:850px){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{flex-wrap:wrap}.actions p{flex-basis:100%}}
@media(max-width:520px){.category-grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.report{padding:16px}.detailed .fields{grid-template-columns:1fr}}
@media print{.report{border:0;border-radius:0;box-shadow:none}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:4mm}.product{break-inside:avoid;page-break-inside:avoid}.photos figure img,.no-photo{height:37mm}.product-head h3{font-size:11pt}.fields,.description{font-size:8pt}.summary{grid-template-columns:repeat(4,1fr)}.summary>div{padding:3mm}.group-title{break-after:avoid;page-break-after:avoid}.detailed .product{break-inside:auto}.detailed .photos figure img{height:42mm}}
</style></head><body><div class="actions"><p id="status">Preparando el reporte y sus fotografías…</p><label for="layout">Vista:</label><select id="layout"><option value="cards">Tarjetas</option><option value="detailed">Detalle completo</option></select><button id="print" disabled>Guardar como PDF / Imprimir</button></div><main id="report" class="report"></main><script>
'use strict';
const container=document.getElementById('report');
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function date(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return 'Sin registrar';return value.split('-').reverse().join('/');}
function state(value){return ({BUENO:'Buen estado',REGULAR:'Estado regular',MALO:'Mal estado',MIXTO:'Estados diferentes'})[value]||value||'Sin registrar';}
function table(headers,rows){const t=element('table'),head=element('thead'),tr=element('tr');headers.forEach(h=>tr.append(element('th',h)));head.append(tr);t.append(head);const body=element('tbody');rows.forEach(row=>{const r=element('tr');row.forEach(v=>r.append(element('td',String(v??''))));body.append(r);});t.append(body);return t;}
async function build(){try{let data;const key=new URLSearchParams(location.search).get('snapshot');if(key){const raw=localStorage.getItem(key);if(raw){data=JSON.parse(raw);localStorage.removeItem(key);}}if(!data){const response=await fetch('guardar.php',{cache:'no-store'});if(!response.ok)throw new Error('No se pudo cargar el inventario.');data=(await response.json()).inventario;}if(!Array.isArray(data.equipos))throw new Error('Inventario inválido.');
const items=data.equipos,groups=new Map();items.forEach(i=>{const cat=i.categoria||'Otros';if(!groups.has(cat))groups.set(cat,[]);groups.get(cat).push(i);});
container.append(element('div',data.sede||'Vallesol','eyebrow'),element('h1','Reporte completo del inventario'),element('p',`Fuente: ${data.fuente||'Inventario local'} · ${data.periodo||''}`,'muted'),element('p',`Generado: ${new Intl.DateTimeFormat('es-CO',{dateStyle:'long',timeStyle:'short',timeZone:'America/Bogota'}).format(new Date())}`,'muted'));
const summary=element('div',undefined,'summary');[[items.length,'Fichas'],[items.reduce((n,i)=>n+Number(i.cantidad||0),0),'Unidades'],[groups.size,'Categorías'],[items.filter(i=>!i.imagenes?.length).length,'Fichas sin fotografía']].forEach(([n,label])=>{const box=element('div');box.append(element('strong',n),element('span',label));summary.append(box);});container.append(summary,element('h2','Resumen por categoría'),table(['Categoría','Fichas','Unidades','Sin fotografía'],[...groups].sort((a,b)=>a[0].localeCompare(b[0],'es')).map(([c,list])=>[c,list.length,list.reduce((n,i)=>n+Number(i.cantidad),0),list.filter(i=>!i.imagenes?.length).length])));
let missing=0;const loads=[];
for(const [category,list] of [...groups].sort((a,b)=>a[0].localeCompare(b[0],'es'))){container.append(element('h2',category,'group-title'));const grid=element('div',undefined,'category-grid');container.append(grid);for(const item of list.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')||String(a.id).localeCompare(String(b.id),'es',{numeric:true}))){const section=element('article',undefined,'product'),header=element('div',undefined,'product-head');header.append(element('h3',item.nombre),element('span',`${item.cantidad} ${Number(item.cantidad)===1?'unidad':'unidades'} · ${state(item.estado)}`,'badge'));section.append(header);const fields=element('div',undefined,'fields');[['ID principal',item.id],['Placa principal',item.placa],['Marca',item.marca],['Referencia',item.referencia],['Tipo',item.tipo],['Color',item.color],['Ubicación',item.ubicacion],['Adquisición',date(item.fecha_adquisicion)]].forEach(([label,value])=>{const p=element('p');p.append(element('b',label+': '),document.createTextNode(value||'Sin registrar'));fields.append(p);});section.append(fields,element('p',item.detalle||'Sin descripción adicional.','description'));
const pictures=Array.isArray(item.imagenes)?item.imagenes:[];if(!pictures.length)section.append(element('div','Sin fotografía asociada','no-photo'));else{const photos=element('div',undefined,'photos');pictures.forEach((path,index)=>{const figure=element('figure');if(typeof path!=='string'||path.includes('..')||!path.startsWith(`imagenes/${item.id}/`)||!/^imagenes\/[\w-]+\/[\w .-]+\.(jpg|jpeg|png|webp)$/i.test(path)){missing++;figure.append(element('p','Ruta de fotografía inválida','error'));}else{const img=element('img');img.alt=`${item.nombre} · fotografía ${index+1}`;loads.push(new Promise(resolve=>{img.onload=resolve;img.onerror=()=>{missing++;img.remove();figure.prepend(element('div','Fotografía no disponible','no-photo'));resolve();};}));img.src=path;figure.append(img);}figure.append(element('figcaption',index===0?'Fotografía principal':`Fotografía ${index+1}`));photos.append(figure);});section.append(photos);}
if(item.registros?.length)section.append(element('h4','Registros individuales'),table(['ID','Placa','Cantidad','Estado','Adquisición'],item.registros.map(r=>[r.id,r.placa||'Sin placa',r.cantidad,state(r.estado||item.estado),date(r.fecha_adquisicion)])));const cover=section.querySelector('.photos,.no-photo');if(cover)section.prepend(cover);grid.append(section);}}
container.append(element('div',`Fin del reporte · ${items.length} fichas · ${items.reduce((n,i)=>n+Number(i.cantidad||0),0)} unidades. Las fichas agrupadas conservan sus registros individuales.`,'footer'));
await Promise.all(loads);document.getElementById('status').textContent=`Vista previa lista. El PDF conservará la vista seleccionada (tarjetas o detalle completo). Selecciona «Guardar como PDF» como destino de impresión.${missing?` ${missing} fotografías no disponibles.`:''}`;document.getElementById('print').disabled=false;
}catch(error){document.getElementById('status').textContent=error.message;container.append(element('p',error.message,'error'));}}
document.getElementById('layout').addEventListener('change',event=>container.classList.toggle('detailed',event.target.value==='detailed'));
document.getElementById('print').addEventListener('click',()=>window.print());build();
</script></body></html>
