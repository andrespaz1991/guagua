 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Foto de Perfil Circular</title>
    <style>
        /* Variables y Reset */
        :root {
            --bg-color: #f0f2f5;
            --surface: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Principal */
        .card {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 480px;
            padding: 32px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        /* Controles de Subida */
        .upload-btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 20px;
        }

        .upload-btn:hover {
            background-color: var(--primary-hover);
        }

        input[type="file"] {
            display: none;
        }

        /* Área de Edición */
        .editor-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        /* El canvas simula visualmente un recorte circular en pantalla */
        canvas {
            background-image: repeating-linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc), repeating-linear-gradient(45deg, #ccc 25%, var(--surface) 25%, var(--surface) 75%, #ccc 75%, #ccc);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            border-radius: 50%;
            box-shadow: 0 0 0 4px var(--surface), 0 0 0 6px var(--border);
            cursor: grab;
            max-width: 100%;
            height: auto;
            touch-action: none; /* Previene scroll al arrastrar en móviles */
        }

        canvas:active {
            cursor: grabbing;
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls label {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: left;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .download-btn {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: #059669;
        }

        .hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: -5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Foto Circular</h1>
            <p>Sube y ajusta tu imagen para plataformas</p>
        </div>

        <label class="upload-btn">
            Seleccionar Imagen
            <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
        </label>

        <div class="editor-container" id="editorContainer">
            <p class="hint">Arrastra la imagen para posicionarla</p>
            <!-- Canvas configurado a 400x400 para alta calidad de salida -->
            <canvas id="canvas" width="400" height="400"></canvas>
            
            <div class="controls">
                <label for="zoomSlider">Nivel de Zoom</label>
                <input type="range" id="zoomSlider" min="0.5" max="3" step="0.01" value="1">
            </div>

            <button class="download-btn" id="downloadBtn">Descargar Imagen (.PNG)</button>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const editorContainer = document.getElementById('editorContainer');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const zoomSlider = document.getElementById('zoomSlider');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentImage = null;
        
        // Estado de transformación
        const CANVAS_SIZE = 400;
        let zoomLevel = 1;
        let offsetX = 0;
        let offsetY = 0;
        
        // Estado de interacción
        let isDragging = false;
        let startX, startY;

        // Carga de la imagen
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    // Resetear transformaciones al cargar nueva imagen
                    zoomSlider.value = 1;
                    zoomLevel = 1;
                    offsetX = 0;
                    offsetY = 0;
                    
                    editorContainer.style.display = 'flex';
                    renderCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Lógica principal de dibujo y recorte
        function renderCanvas() {
            if (!currentImage) return;

            // Limpiar lienzo
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Guardar contexto antes de aplicar recorte
            ctx.save();

            // Crear trazado circular y aplicar máscara (clip)
            ctx.beginPath();
            ctx.arc(CANVAS_SIZE / 2, CANVAS_SIZE / 2, CANVAS_SIZE / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            // Calcular escala base para cubrir el canvas completo (Object-fit: cover)
            const baseScale = Math.max(CANVAS_SIZE / currentImage.width, CANVAS_SIZE / currentImage.height);
            const finalScale = baseScale * zoomLevel;

            // Dimensiones finales de dibujo
            const drawWidth = currentImage.width * finalScale;
            const drawHeight = currentImage.height * finalScale;

            // Coordenadas para centrar la imagen + el desplazamiento del usuario (offset)
            const dx = (CANVAS_SIZE - drawWidth) / 2 + offsetX;
            const dy = (CANVAS_SIZE - drawHeight) / 2 + offsetY;

            // Dibujar imagen
            ctx.drawImage(currentImage, dx, dy, drawWidth, drawHeight);

            // Restaurar contexto
            ctx.restore();
        }

        // Control de Zoom
        zoomSlider.addEventListener('input', (e) => {
            zoomLevel = parseFloat(e.target.value);
            renderCanvas();
        });

        // Eventos de Mouse (Computadoras)
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.offsetX;
            startY = e.offsetY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            // Calcular el cambio proporcional al tamaño visual vs tamaño real del canvas
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            offsetX += (e.offsetX - startX) * scaleX;
            offsetY += (e.offsetY - startY) * scaleY;
            
            startX = e.offsetX;
            startY = e.offsetY;
            renderCanvas();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // Eventos Táctiles (Móviles)
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            isDragging = true;
            startX = touch.clientX - rect.left;
            startY = touch.clientY - rect.top;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault(); // Evita que la página haga scroll al arrastrar la imagen
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            offsetX += (x - startX) * scaleX;
            offsetY += (y - startY) * scaleY;

            startX = x;
            startY = y;
            renderCanvas();
        }, { passive: false });

        canvas.addEventListener('touchend', () => { isDragging = false; });

        // Descarga de la imagen
        downloadBtn.addEventListener('click', () => {
            if (!currentImage) return;
            const link = document.createElement('a');
            link.download = 'foto-perfil-circular.png';
            // Exportar como PNG mantiene el fondo transparente por fuera del clip circular
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
